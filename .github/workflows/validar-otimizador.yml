name: Validar HS-Tech

on:
  push:
    branches: [main]
    paths:
      - 'codigo-fonte/OtimizadorGamer.ps1'
      - '.github/workflows/validar-otimizador.yml'
  pull_request:
    branches: [main]
    paths:
      - 'codigo-fonte/OtimizadorGamer.ps1'
      - '.github/workflows/validar-otimizador.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PowerShell
        shell: powershell
        run: |
          $arquivo = Join-Path $env:GITHUB_WORKSPACE 'codigo-fonte\OtimizadorGamer.ps1'
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($arquivo, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -gt 0) {
            $erros | ForEach-Object { Write-Error ("Linha {0}, coluna {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Host 'OK: sintaxe PowerShell aceita pelo parser do Windows.'

      - name: Verificar protecoes de limpeza e restauracao
        shell: powershell
        run: |
          $codigo = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'codigo-fonte\OtimizadorGamer.ps1') -Raw
          $verificacoes = @(
            @{ Nome = 'Confirma limpeza'; Regex = 'Confirmar\s+"A limpeza remove arquivos temporarios' },
            @{ Nome = 'Preserva Lixeira'; Regex = 'A Lixeira e preservada intencionalmente' },
            @{ Nome = 'Backup DNS por adaptador'; Regex = 'DNSOriginal\|\$\(\$a\.ifIndex\)' },
            @{ Nome = 'Restauracao DNS'; Regex = 'Set-DnsClientServerAddress -InterfaceIndex \$indice' },
            @{ Nome = 'Confirma plano de energia'; Regex = 'Plano Alto desempenho ativado e confirmado' },
            @{ Nome = 'Tratamento da bateria em notebook'; Regex = 'BatteryFullChargedCapacity|BatteryStaticData' },
            @{ Nome = 'Identidade HS-Tech'; Regex = 'HS-TECH - CENTRAL DE FERRAMENTAS' },
            @{ Nome = 'Valida espaço contíguo da nova partição'; Regex = '\$bloco\.Tamanho -lt \$bytes' },
            @{ Nome = 'Nova partição usa o bloco validado'; Regex = 'New-Partition -DiskNumber \$partAtual\.DiskNumber -Offset \(\[UInt64\]\$bloco\.Inicio\)' },
            @{ Nome = 'Rollback se a criação falhar'; Regex = '\$volumeReduzido -and -not \$particaoNovaCriada' },
            @{ Nome = 'Remove cache HS-Tech na desinstalação'; Regex = '\$pastaDadosHS|pastaDadosHS' },
            @{ Nome = 'Aviso sobre backup no mesmo disco'; Regex = 'MESMO disco físico' }
          )
          $falhas = @()
          foreach ($v in $verificacoes) {
            if ($codigo -notmatch $v.Regex) { $falhas += $v.Nome }
            else { Write-Host ("OK: " + $v.Nome) }
          }
          # Verifica apenas a rotina de limpeza temporaria. A limpeza profunda
          # tem uma opcao separada de Lixeira, escolhida explicitamente pelo usuario.
          $rotinaLimpeza = [regex]::Match($codigo, '(?s)function\s+Limpar-Temporarios\b.*?(?=\r?\nfunction\s+|\z)').Value
          if (-not $rotinaLimpeza) {
            $falhas += 'Rotina Limpar-Temporarios nao encontrada'
          } elseif ($rotinaLimpeza -match 'Clear-RecycleBin|LOCALAPPDATA\\NVIDIA\\DXCache|LOCALAPPDATA\\AMD\\DxCache') {
            $falhas += 'A limpeza temporaria inclui Lixeira ou caches de shaders'
          }
          if ($falhas.Count -gt 0) {
            $falhas | ForEach-Object { Write-Error ("Falhou: " + $_) }
            exit 1
          }
          Write-Host 'OK: verificacoes estaticas de seguranca passaram.'
