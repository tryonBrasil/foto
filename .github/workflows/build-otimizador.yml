name: Build HS Tech Otimizador Gamer EXE

on:
  push:
    branches: [main]
    paths:
      - 'codigo-fonte/OtimizadorGamer.ps1'
      - 'Exemplo_Relatorio.html'
      - 'LEIA-ME.txt'
      - '.github/workflows/build-otimizador.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-e-empacotar:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PowerShell
        shell: powershell
        run: |
          $arquivo = Join-Path $env:GITHUB_WORKSPACE 'codigo-fonte\OtimizadorGamer.ps1'
          if (!(Test-Path $arquivo)) { throw "Script principal não encontrado: $arquivo" }
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($arquivo, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -gt 0) {
            $erros | ForEach-Object { Write-Error ("Linha {0}, coluna {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Host 'OK: sintaxe PowerShell validada.'

      - name: Instalar PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe

      - name: Gerar executavel
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'codigo-fonte\OtimizadorGamer.ps1'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'OtimizadorGamer.exe'
          Invoke-PS2EXE -inputFile $script -outputFile $exe -noConsole -x64 -requireAdmin -STA -DPIAware -title "HS Tech - Central de Ferramentas" -company "HS Tech" -product "HS Tech Diagnostico e Otimizacao" -version "2.1.0.0"
          if (!(Test-Path $exe)) { throw 'O executavel nao foi gerado.' }

      - name: Preparar pacote
        shell: powershell
        run: |
          $pacote = Join-Path $env:GITHUB_WORKSPACE 'pacote'
          New-Item -ItemType Directory -Path $pacote -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'OtimizadorGamer.exe') $pacote
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'codigo-fonte\OtimizadorGamer.ps1') $pacote
          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'LEIA-ME.txt')) { Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LEIA-ME.txt') $pacote }
          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'Exemplo_Relatorio.html')) { Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Exemplo_Relatorio.html') $pacote }

      - name: Publicar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: HS-Tech-Otimizador-Windows
          path: pacote/
          if-no-files-found: error
          retention-days: 14
