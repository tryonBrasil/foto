name: Build Otimizador Gamer EXE

on:
  push:
    branches: [main]
    paths:
      - 'OtimizadorGamer.ps1'
      - 'Iniciar-Otimizador.bat'
      - '.github/workflows/build-otimizador.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-e-empacotar:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PowerShell
        shell: powershell
        run: |
          $arquivo = Join-Path $env:GITHUB_WORKSPACE 'OtimizadorGamer.ps1'
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($arquivo, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -gt 0) {
            $erros | ForEach-Object { Write-Error ("Linha {0}, coluna {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Host 'OK: sintaxe PowerShell validada.'

      - name: Instalar PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe

      - name: Gerar executavel
        shell: powershell
        run: |
          Invoke-PS2EXE -inputFile "$env:GITHUB_WORKSPACE\OtimizadorGamer.ps1" -outputFile "$env:GITHUB_WORKSPACE\OtimizadorGamer.exe" -noConsole -x64 -requireAdmin -STA -DPIAware -title "HS Tech - Central de Ferramentas" -company "HS Tech" -product "HS Tech Diagnostico e Otimizacao" -version "2.1.0.0"
          if (!(Test-Path "$env:GITHUB_WORKSPACE\OtimizadorGamer.exe")) { throw 'O executavel nao foi gerado.' }

      - name: Preparar pacote
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\pacote" -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\OtimizadorGamer.exe" "$env:GITHUB_WORKSPACE\pacote\"
          Copy-Item "$env:GITHUB_WORKSPACE\Iniciar-Otimizador.bat" "$env:GITHUB_WORKSPACE\pacote\"
          Copy-Item "$env:GITHUB_WORKSPACE\OtimizadorGamer.ps1" "$env:GITHUB_WORKSPACE\pacote\"

      - name: Publicar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: OtimizadorGamer-Windows
          path: pacote/
          if-no-files-found: error
          retention-days: 14
