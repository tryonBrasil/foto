name: Build HS Tech Diagnostico EXE

on:
  push:
    branches: [main]
    paths:
      - 'HS-Tech-Diagnostico.ps1'
      - '.github/workflows/build-hs-tech.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-e-empacotar:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PowerShell
        shell: powershell
        run: |
          $arquivo = Join-Path $env:GITHUB_WORKSPACE 'HS-Tech-Diagnostico.ps1'
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($arquivo, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -gt 0) {
            $erros | ForEach-Object { Write-Error ("Linha {0}, coluna {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Host 'OK: sintaxe PowerShell validada.'

      - name: Instalar PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe

      - name: Gerar executavel
        shell: powershell
        run: |
          Invoke-PS2EXE -inputFile "$env:GITHUB_WORKSPACE\HS-Tech-Diagnostico.ps1" -outputFile "$env:GITHUB_WORKSPACE\HS-Tech-Diagnostico.exe" -noConsole -x64
          if (!(Test-Path "$env:GITHUB_WORKSPACE\HS-Tech-Diagnostico.exe")) { throw 'O executavel nao foi gerado.' }

      - name: Preparar pacote
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\pacote-hs-tech" -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\HS-Tech-Diagnostico.exe" "$env:GITHUB_WORKSPACE\pacote-hs-tech\"
          Copy-Item "$env:GITHUB_WORKSPACE\HS-Tech-Diagnostico.ps1" "$env:GITHUB_WORKSPACE\pacote-hs-tech\"

      - name: Publicar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: HS-Tech-Diagnostico-Windows
          path: pacote-hs-tech/
          if-no-files-found: error
          retention-days: 14
